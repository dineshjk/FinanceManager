name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black isort

    - name: Lint with black
      run: |
        black --check GUIStock/

    - name: Sort imports with isort
      run: |
        isort --check-only GUIStock/

    - name: Test import structure
      run: |
        python -c "import GUIStock; print('Package imports successfully')"

    - name: Run basic application test
      run: |
        python -c "
        import sys
        import os
        sys.path.insert(0, '.')
        # Test that we can import main modules without GUI
        try:
            from GUIStock.config import globals
            from GUIStock.dbutils import company_utils
            print('Core modules import successfully')
        except Exception as e:
            print(f'Import error: {e}')
            sys.exit(1)
        "

    # Note: GUI tests are skipped in CI as they require display
    # - name: Run tests
    #   run: |
    #     pytest tests/ --cov=GUIStock --cov-report=xml

    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     file: ./coverage.xml

  package-check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Check package structure
      run: |
        python -c "
        import os
        import sys

        # Check for required files
        required_files = [
            'requirements.txt',
            'README.md',
            'LICENSE',
            'GUIStock/__init__.py',
            'GUIStock/MyGUIStock.py'
        ]

        missing_files = []
        for file in required_files:
            if not os.path.exists(file):
                missing_files.append(file)

        if missing_files:
            print(f'Missing required files: {missing_files}')
            sys.exit(1)
        else:
            print('All required files present')
        "

    - name: Validate VS Code configuration
      run: |
        python -c "
        import json
        import os

        # Check VS Code files
        vscode_files = ['.vscode/launch.json', '.vscode/settings.json']

        for file in vscode_files:
            if os.path.exists(file):
                try:
                    with open(file, 'r') as f:
                        json.load(f)
                    print(f'{file} is valid JSON')
                except json.JSONDecodeError as e:
                    print(f'{file} has invalid JSON: {e}')
                    exit(1)
            else:
                print(f'{file} not found (optional)')
        "

  security-check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run bandit security check
      run: |
        bandit -r GUIStock/ -f json -o bandit-report.json || true

    - name: Check for known vulnerabilities
      run: |
        safety check --json || true

  documentation-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check README
      run: |
        if [ ! -f README.md ]; then
          echo "README.md is missing"
          exit 1
        fi

        # Check for required sections
        required_sections=("Features" "Installation" "Usage" "Contributing")
        for section in "${required_sections[@]}"; do
          if ! grep -q "$section" README.md; then
            echo "README.md is missing $section section"
            exit 1
          fi
        done

        echo "README.md validation passed"

    - name: Check links in README
      run: |
        # Install markdown-link-check
        npm install -g markdown-link-check

        # Check links (allow failures for local links)
        markdown-link-check README.md --config .github/workflows/mlc_config.json || true
